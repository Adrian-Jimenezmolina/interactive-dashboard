<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>JavaScript Debugging Exercise</title>
</head>
<body>
    <h1>Dashboard Status</h1>
    <div id="display"></div>
 
    <script>
        // Weekly Goal: Calculate the total weekly task goal for a user.
        
        // Declare variables and values
        let userName = "Jane Doe";
        let dailyGoal = 5; 
        let bonusTasks = "2"; 
 
        // Output message to console
        console.log("Checking status for: " + userName;
 
        // FIXED: Corrected misspelled variable name from "dialyGoal" to "dailyGoal"
        // FIXED: Changed multiplier from 15 to 5 (number of workdays)
        let weeklyGoal = dailyGoal * 5; 
 
        // FIXED: Converted bonusTasks from string to number and changed operator from - to +
        let totalGoal = weeklyGoal + Number(bonusTasks); 
 
        // Output results to web page
        document.write("User: " + userName + "<br>");
        // FIXED: Corrected document.write so it displays the value of totalGoal
        document.write("Total Weekly Goal: " + totalGoal);
 
    </script>
</body>
</html>
