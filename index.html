<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h1>My Interactive Dashboard</h1>
    <p>This dashboard was created by Adrian Jimenez-Molina for the WEB-115 course at Wake Tech</p>

    <!-- Removed the old document.write() and the old script.js link -->

    <div class="container">
        <div class="row">
            <!-- NEW: Weekly Tasks section -->
            <div class="col" id="weekly-tasks">
                <h2>Weekly Task Goals</h2>

                <!-- Form to collect user input -->
                <form id="goal-form" class="mb-3">
                    <div class="mb-3">
                        <label for="user-name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="user-name" placeholder="Enter your name" required>
                    </div>

                    <div class="mb-3">
                        <label for="daily-goal" class="form-label">Daily Task Goal</label>
                        <input type="number" class="form-control" id="daily-goal" min="0" placeholder="e.g. 5" required>
                    </div>

                    <div class="mb-3">
                        <label for="bonus-tasks" class="form-label">Weekly Bonus Tasks</label>
                        <input type="number" class="form-control" id="bonus-tasks" min="0" placeholder="e.g. 3" required>
                    </div>

                    <button type="submit" class="btn btn-primary" id="goal-btn">Calculate Weekly Goal</button>
                </form>

                <!-- Output area -->
                <p id="goal-message" class="alert alert-info" style="display: none;"></p>

                <!-- Link to the new external JavaScript file -->
                <script src="js/task-manager.js"></script>
            </div>
        </div>
    </div>

                <p id="goal-message" class="alert alert-info" style="display: none;"></p>
            </div>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="js/task-manager.js"></script>

    <!-- Bootstrap JS -->
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
